name: 00 · Install Deps

# Reusable workflow: primes the pnpm store cache (keyed on pnpm-lock.yaml) so
# every caller gets a fast cache-hit install instead of a full network download.
# Called by 01-ci.yml; its four installing jobs then restore the warm store.

on:
  workflow_call:

permissions: {}

jobs:
  install:
    name: Install & cache deps
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      # No `version:` input: the action reads `packageManager` (pnpm@11.1.2)
      # from package.json. Passing both makes the action fail on the mismatch.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm # keys on pnpm-lock.yaml hash — shared across all workflows in this repo
      - run: pnpm install --frozen-lockfile
