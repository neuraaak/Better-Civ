name: 01 · CI

# Quality gate on every pull request and, through 02-tag-sync, on every push
# to main. Mirrors `pnpm check`, split into parallel jobs.

# No bare push trigger: PRs cover feature branches, and on main CI runs as the
# release gate via workflow_call from 02-tag-sync.yml (which fires on every push to
# main). This keeps exactly one CI run per change — no double-runs.
on:
  pull_request: # no paths filter: prettier covers the whole tree
  workflow_call: # called by 02-tag-sync.yml as the release gate
  workflow_dispatch:

permissions:
  contents: read # minimum for checkout in 00-install-deps nested job

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a run on main (it may be releasing).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Four consumers (quality, type-check, test, build): above the ~3-consumer
  # threshold, so the primer pays for its serial link.
  install-deps:
    name: Install & cache deps
    uses: ./.github/workflows/00-install-deps.yml

  quality:
    name: Lint & format
    needs: [install-deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm # cache hit from install job — no network download
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint

  type-check:
    name: Type check
    needs: [install-deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # vue-tsc on both projects: src (tsconfig.json) and tests (tests/tsconfig.json).
      - run: pnpm type-check

  security:
    name: Security scan
    # No install and no primer: `pnpm audit` reads the lockfile, not node_modules.
    # Separate from `quality` so an upstream advisory reddens its own job instead
    # of the deterministic gate — and never gates the tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Runtime dependencies only: dev-tree advisories with no upstream fix
      # would block every PR without making the shipped bundle any safer.
      - run: pnpm audit --audit-level high --prod

  test:
    name: Tests
    needs: [install-deps] # parallel with quality — no gate between them
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm # cache hit from install job — no network download
      - run: pnpm install --frozen-lockfile
      # test:coverage runs the full suite + the threshold gate in one pass. The
      # floors sit under `coverage.thresholds` in config/vitest.config.js, which
      # only applies with --coverage — a local `pnpm test:run` never inherits them.
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # Always build: a PR whose Vite build breaks fails here, before Vercel ever
  # sees it. The artifact is for inspection only — Vercel builds its own.
  build:
    name: Build app
    needs: [install-deps]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
