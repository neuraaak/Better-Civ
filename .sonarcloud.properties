# SonarCloud automatic analysis settings.
# https://docs.sonarsource.com/sonarqube-cloud/advanced-setup/automatic-analysis/

# Translation tables repeat the same keys once per language. SonarJS compares
# string literals as equal tokens, so every language block reads as a copy of
# the others. They are data, not logic: keep them out of duplication detection.
sonar.cpd.exclusions=src/i18n/messages.ts
